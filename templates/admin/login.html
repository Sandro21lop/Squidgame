{% extends "base.html" %}
{% block body %}
<div class="auth-page">
  <div class="auth-card">
    <h1>Panel Quid Game TikTok</h1>
    <p class="sub">Solo para administración.</p>

    {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}

    <form method="POST">
      <div class="field">
        <label>Correo</label>
        <input type="email" name="email" required>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" name="password" required>
      </div>
      <button class="btn-block" type="submit">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
